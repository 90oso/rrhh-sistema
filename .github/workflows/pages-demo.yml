name: Publicar demo comercial (rama aislada)
on:
  push:
    branches: [feat/commercial-demo-2026-10]
    paths:
      - 'docs/**'
      - '.github/workflows/pages-demo.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages-demo"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/commercial-demo-2026-10
      - name: Verificar que se publica exclusivamente la demo
        run: test -f docs/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
